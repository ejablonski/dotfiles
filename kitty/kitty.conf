# vim:fileencoding=utf-8:foldmethod=marker

# BEGIN_KITTY_THEME
# Tokyo Night
include current-theme.conf
# END_KITTY_THEME

# --- Typography (JetBrains Mono Nerd Font) ---
font_family         JetBrainsMono Nerd Font
bold_font           JetBrainsMono Nerd Font Bold
italic_font         JetBrainsMono Nerd Font Italic
bold_italic_font    JetBrainsMono Nerd Font Bold Italic

font_size           13.0

# Render code ligatures (set to 'never' to always enable them)
disable_ligatures   never


# --- Spacing & Padding ---
# 10px internal padding gives breathing room that balances your 10px window gaps
window_padding_width    10
placement_strategy      center


# --- Transparency ---
# 0.90 - 0.93 keeps text legible while giving a clean frosted look
background_opacity         0.92
dynamic_background_opacity  yes


# --- Quality of Life ---
# Disable annoying terminal bell sound
enable_audio_bell          no

# Don't ask for confirmation when closing windows
confirm_os_window_close    0

# Smooth cursor styling
cursor_shape               beam
cursor_blink_interval      0.5
