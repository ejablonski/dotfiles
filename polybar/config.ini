[colors]
background = #1a1b26
background-alt = #24283b
foreground = #c0caf5
foreground-alt = #565f89
blue = #7aa2f7
cyan = #7dcfff
green = #9ece6a
magenta = #bb9af7
red = #f7768e
orange = #ff9e64
yellow = #e0af68

# Semantic aliases
primary = #7aa2f7
secondary = #7dcfff
alert = #f7768e

[bar/main]
width = 100%
height = 22pt
radius = 0
offset-x = 0
offset-y = 0

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2pt
border-size = 0pt
padding-left = 1
padding-right = 2
module-margin = 1

separator = |
separator-foreground = ${colors.foreground-alt}

# Uses JetBrains Mono Nerd Font for both text and icons
font-0 = "JetBrainsMono Nerd Font:size=10;2"
font-1 = "JetBrainsMono Nerd Font:size=11;3"

modules-left = xworkspaces
modules-right = cpu memory pulseaudio bluetooth wlan battery0 battery1 date
modules-center = timewarrior

cursor-click = pointer
enable-ipc = true

# set the bar to use the MONITOR environment variable passed by the launcher
monitor = ${env:MONITOR:}
# ensure Polybar doesn't reserve space on top of i3 windows awkwardly
override-redirect = false

[module/timewarrior]
type = custom/script
exec = ~/.config/polybar/timewarrior.sh
interval = 5
click-left = timew stop && polybar-msg action "#timewarrior.hook.0" 2>/dev/null
click-right = timew continue && pkill -SIGUSR1 polybar

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline = ${colors.blue}
label-active-padding = 2

label-occupied = %name%
label-occupied-padding = 2

label-urgent = %name%
label-urgent-background = ${colors.red}
label-urgent-padding = 2

label-empty = %name%
label-empty-foreground = ${colors.foreground-alt}
label-empty-padding = 2

[module/wlan]
type = internal/network
interface-type = wireless
interval = 3.0

# Connected: WiFi icon only (no SSID text)
format-connected = <label-connected>
label-connected = 󰤨
label-connected-foreground = ${colors.blue}

# Disconnected: Crossed-out WiFi icon
format-disconnected = <label-disconnected>
label-disconnected = 󰤮
label-disconnected-foreground = ${colors.red}

[module/bluetooth]
type = custom/script
exec = sh -c 'if [ "$(bluetoothctl show 2>/dev/null | grep -o "Powered: yes")" = "Powered: yes" ]; then echo "%{F#7aa2f7}󰂯%{F-}"; else echo "%{F#f7768e}󰂲%{F-}"; fi'
interval = 2
click-left = sh -c 'bluetoothctl power $([ "$(bluetoothctl show 2>/dev/null | grep -o "Powered: yes")" = "Powered: yes" ] && echo "off" || echo "on")'

# ==============================================================================
# BATTERY 0 (Internal)
# ==============================================================================
[module/battery0]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 98

format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
label-charging = %percentage%%
label-discharging = %percentage%%
label-full = 󰁹 %percentage%%

ramp-capacity-0 = 󰁺
ramp-capacity-1 = 󰁼
ramp-capacity-2 = 󰁾
ramp-capacity-3 = 󰂀
ramp-capacity-4 = 󰁹
ramp-capacity-foreground = ${colors.yellow}

animation-charging-0 = 󰁺
animation-charging-1 = 󰁼
animation-charging-2 = 󰁾
animation-charging-3 = 󰂀
animation-charging-4 = 󰁹
animation-charging-foreground = ${colors.green}
animation-charging-framerate = 750

# ==============================================================================
# BATTERY 1 (External / Removable)
# ==============================================================================
[module/battery1]
type = internal/battery
battery = BAT1
adapter = AC
full-at = 98

format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
label-charging = %percentage%%
label-discharging = %percentage%%
label-full = 󰁹 %percentage%%

ramp-capacity-0 = 󰁺
ramp-capacity-1 = 󰁼
ramp-capacity-2 = 󰁾
ramp-capacity-3 = 󰂀
ramp-capacity-4 = 󰁹
ramp-capacity-foreground = ${colors.yellow}

animation-charging-0 = 󰁺
animation-charging-1 = 󰁼
animation-charging-2 = 󰁾
animation-charging-3 = 󰂀
animation-charging-4 = 󰁹
animation-charging-foreground = ${colors.green}
animation-charging-framerate = 750

[module/date]
type = internal/date
interval = 1.0

# 12-hour format with AM/PM
time = %I:%M %p
date = %b %d

label = 󰥔 %time%  %date%
label-foreground = ${colors.orange}

# ==============================================================================
# CPU USAGE
# ==============================================================================
[module/cpu]
type = internal/cpu
interval = 2
format = <label>
format-prefix = "󰍛 "
format-prefix-foreground = ${colors.primary}
label = %percentage%%

# ==============================================================================
# RAM USAGE
# ==============================================================================
[module/memory]
type = internal/memory
interval = 2
format = <label>
format-prefix = "󰘚 "
format-prefix-foreground = ${colors.secondary}
label = %percentage_used%%

# ==============================================================================
# SOUND / AUDIO
# ==============================================================================
# Direct ALSA mixer control mapped under pulseaudio module name
[module/pulseaudio]
type = internal/alsa

master-soundcard = default
speaker-soundcard = default
headphone-soundcard = default

master-mixer = Master

format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%

ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-foreground = ${colors.primary}

format-muted = <label-muted>
label-muted = "󰝟"
label-muted-foreground = ${colors.alert}
